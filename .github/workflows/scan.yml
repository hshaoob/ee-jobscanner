name: scan
on:
  schedule:
    - cron: "17 * * * *"     # backup only: restarts the chain below if it ever breaks
  workflow_dispatch:
concurrency:
  group: scan              # never two scans at once; the next one waits
  cancel-in-progress: false
permissions:
  contents: write          # to save seen.json etc. back to the repo
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75      # ~12 min scan, then the alert waits for the top of the hour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python jobscan.py test
      - run: python jobscan.py
        env:
          JOBSCAN_TO: ${{ secrets.JOBSCAN_TO }}
          JOBSCAN_FROM: ${{ secrets.JOBSCAN_FROM }}
          JOBSCAN_PASS: ${{ secrets.JOBSCAN_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # higher GitHub API limit for logo lookups
      - name: Save state
        if: always()       # keep what was learned even if the run failed after emailing
        run: |
          git config user.name "jobscan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "scan state"; git pull -q --rebase && git push -q; }
  next:
    # GitHub's cron is unreliable on this repo, so each run starts the next one itself,
    # right after its alert goes out on the hour. That scan then alerts on the following hour.
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write       # to start the next run
    steps:
      - name: Start the next scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w scan.yml --json databaseId,status \
            -q "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$busy" = 0 ]; then gh workflow run scan.yml -R "$GITHUB_REPOSITORY" --ref main; else echo "a scan is already queued"; fi
